<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Pong</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-cyan: #00f0ff;
            --neon-pink: #ff2d95;
            --neon-purple: #b026ff;
            --neon-green: #39ff14;
            --bg-deep: #05010f;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background:
                radial-gradient(circle at 20% 20%, rgba(176, 38, 255, 0.15), transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(0, 240, 255, 0.15), transparent 40%),
                var(--bg-deep);
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        h1 {
            font-size: 2.4rem;
            font-weight: 900;
            letter-spacing: 6px;
            margin-bottom: 18px;
            color: #fff;
            text-shadow:
                0 0 8px var(--neon-cyan),
                0 0 18px var(--neon-cyan),
                0 0 30px var(--neon-pink),
                0 0 50px var(--neon-pink);
            animation: flicker 3s infinite alternate;
        }

        @keyframes flicker {

            0%,
            100% {
                opacity: 1;
            }

            92% {
                opacity: 1;
            }

            93% {
                opacity: 0.6;
            }

            94% {
                opacity: 1;
            }

            97% {
                opacity: 0.8;
            }
        }

        .scoreboard {
            display: flex;
            gap: 60px;
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 14px;
        }

        .score {
            padding: 6px 18px;
            border-radius: 8px;
        }

        .score.player {
            color: var(--neon-cyan);
            text-shadow: 0 0 10px var(--neon-cyan), 0 0 20px var(--neon-cyan);
        }

        .score.ai {
            color: var(--neon-pink);
            text-shadow: 0 0 10px var(--neon-pink), 0 0 20px var(--neon-pink);
        }

        .canvas-wrap {
            position: relative;
            border-radius: 14px;
            padding: 4px;
            background: linear-gradient(135deg, var(--neon-purple), var(--neon-cyan));
            box-shadow:
                0 0 25px rgba(176, 38, 255, 0.6),
                0 0 50px rgba(0, 240, 255, 0.4);
        }

        canvas {
            display: block;
            background: rgba(5, 1, 15, 0.92);
            border-radius: 10px;
        }

        .overlay {
            position: absolute;
            inset: 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(5, 1, 15, 0.78);
            border-radius: 10px;
            text-align: center;
            gap: 18px;
            backdrop-filter: blur(2px);
        }

        .overlay.hidden {
            display: none;
        }

        .overlay h2 {
            font-size: 1.8rem;
            color: var(--neon-green);
            text-shadow: 0 0 10px var(--neon-green), 0 0 22px var(--neon-green);
        }

        .overlay p {
            font-size: 0.95rem;
            line-height: 1.7;
            color: #cfe9ff;
            max-width: 360px;
        }

        .btn {
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 1rem;
            letter-spacing: 2px;
            color: #fff;
            background: transparent;
            border: 2px solid var(--neon-cyan);
            padding: 12px 28px;
            border-radius: 8px;
            cursor: pointer;
            text-shadow: 0 0 8px var(--neon-cyan);
            box-shadow: 0 0 12px rgba(0, 240, 255, 0.5), inset 0 0 12px rgba(0, 240, 255, 0.2);
            transition: all 0.2s ease;
        }

        .btn:hover {
            background: var(--neon-cyan);
            color: var(--bg-deep);
            box-shadow: 0 0 25px var(--neon-cyan), 0 0 45px var(--neon-cyan);
        }

        .hint {
            margin-top: 16px;
            font-size: 0.8rem;
            color: #8aa6c8;
            letter-spacing: 1px;
        }
    </style>
</head>

<body>
    <h1>NEON PONG</h1>
    <div class="scoreboard">
        <div class="score player">YOU <span id="scorePlayer">0</span></div>
        <div class="score ai">AI <span id="scoreAI">0</span></div>
    </div>

    <div class="canvas-wrap">
        <canvas id="game" width="800" height="500"></canvas>
        <div class="overlay" id="overlay">
            <h2 id="overlayTitle">NEON PONG</h2>
            <p id="overlayText">Mueve la pala con el ratón o las flechas ↑ ↓.<br>Primero en llegar a 7 gana.</p>
            <button class="btn" id="startBtn">START</button>
        </div>
    </div>

    <div class="hint">Ratón / ↑ ↓ para mover &nbsp;•&nbsp; P para pausar</div>

    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const W = canvas.width;
        const H = canvas.height;

        const scorePlayerEl = document.getElementById('scorePlayer');
        const scoreAIEl = document.getElementById('scoreAI');
        const overlay = document.getElementById('overlay');
        const overlayTitle = document.getElementById('overlayTitle');
        const overlayText = document.getElementById('overlayText');
        const startBtn = document.getElementById('startBtn');

        const WIN_SCORE = 7;

        const paddle = {
            w: 14,
            h: 90,
            speed: 8
        };

        const player = {
            x: 24,
            y: H / 2 - paddle.h / 2,
            score: 0
        };

        const ai = {
            x: W - 24 - paddle.w,
            y: H / 2 - paddle.h / 2,
            score: 0,
            speed: 5.5
        };

        const ball = {
            x: W / 2,
            y: H / 2,
            r: 9,
            vx: 0,
            vy: 0,
            speed: 6
        };

        let running = false;
        let paused = false;
        const keys = { up: false, down: false };
        let mouseY = null;

        function resetBall(direction) {
            ball.x = W / 2;
            ball.y = H / 2;
            ball.speed = 6;
            const angle = (Math.random() * 0.6 - 0.3); // -0.3..0.3 rad
            const dir = direction || (Math.random() < 0.5 ? -1 : 1);
            ball.vx = dir * ball.speed * Math.cos(angle);
            ball.vy = ball.speed * Math.sin(angle);
        }

        function startGame() {
            player.score = 0;
            ai.score = 0;
            updateScore();
            resetBall();
            overlay.classList.add('hidden');
            running = true;
            paused = false;
            loop();
        }

        function updateScore() {
            scorePlayerEl.textContent = player.score;
            scoreAIEl.textContent = ai.score;
        }

        function endGame(playerWon) {
            running = false;
            overlayTitle.textContent = playerWon ? 'YOU WIN!' : 'AI WINS';
            overlayTitle.style.color = playerWon ? 'var(--neon-cyan)' : 'var(--neon-pink)';
            overlayText.innerHTML = `Puntuación final &nbsp; ${player.score} - ${ai.score}`;
            startBtn.textContent = 'PLAY AGAIN';
            overlay.classList.remove('hidden');
        }

        function togglePause() {
            if (!running) return;
            paused = !paused;
            if (paused) {
                overlayTitle.textContent = 'PAUSED';
                overlayTitle.style.color = 'var(--neon-green)';
                overlayText.innerHTML = 'Pulsa P para continuar';
                startBtn.textContent = 'RESUME';
                overlay.classList.remove('hidden');
            } else {
                overlay.classList.add('hidden');
                loop();
            }
        }

        function update() {
            // Player movement
            if (mouseY !== null) {
                const target = mouseY - paddle.h / 2;
                player.y += (target - player.y) * 0.35;
            }
            if (keys.up) player.y -= paddle.speed;
            if (keys.down) player.y += paddle.speed;
            player.y = Math.max(0, Math.min(H - paddle.h, player.y));

            // AI movement (tracks ball with limited speed)
            const aiCenter = ai.y + paddle.h / 2;
            if (aiCenter < ball.y - 12) ai.y += ai.speed;
            else if (aiCenter > ball.y + 12) ai.y -= ai.speed;
            ai.y = Math.max(0, Math.min(H - paddle.h, ai.y));

            // Ball movement
            ball.x += ball.vx;
            ball.y += ball.vy;

            // Top / bottom walls
            if (ball.y - ball.r < 0) {
                ball.y = ball.r;
                ball.vy *= -1;
            }
            if (ball.y + ball.r > H) {
                ball.y = H - ball.r;
                ball.vy *= -1;
            }

            // Player paddle collision
            if (ball.vx < 0 &&
                ball.x - ball.r < player.x + paddle.w &&
                ball.x - ball.r > player.x &&
                ball.y > player.y && ball.y < player.y + paddle.h) {
                ball.x = player.x + paddle.w + ball.r;
                bounce(player);
            }

            // AI paddle collision
            if (ball.vx > 0 &&
                ball.x + ball.r > ai.x &&
                ball.x + ball.r < ai.x + paddle.w &&
                ball.y > ai.y && ball.y < ai.y + paddle.h) {
                ball.x = ai.x - ball.r;
                bounce(ai);
            }

            // Scoring
            if (ball.x + ball.r < 0) {
                ai.score++;
                updateScore();
                if (ai.score >= WIN_SCORE) return endGame(false);
                resetBall(1);
            }
            if (ball.x - ball.r > W) {
                player.score++;
                updateScore();
                if (player.score >= WIN_SCORE) return endGame(true);
                resetBall(-1);
            }
        }

        function bounce(pad) {
            const rel = (ball.y - (pad.y + paddle.h / 2)) / (paddle.h / 2); // -1..1
            const maxAngle = Math.PI / 3.2;
            const angle = rel * maxAngle;
            const dir = (pad === player) ? 1 : -1;
            ball.speed += 0.4;
            ball.vx = dir * ball.speed * Math.cos(angle);
            ball.vy = ball.speed * Math.sin(angle);
        }

        function drawNet() {
            ctx.save();
            ctx.strokeStyle = 'rgba(176, 38, 255, 0.5)';
            ctx.lineWidth = 3;
            ctx.shadowColor = '#b026ff';
            ctx.shadowBlur = 12;
            ctx.setLineDash([12, 18]);
            ctx.beginPath();
            ctx.moveTo(W / 2, 0);
            ctx.lineTo(W / 2, H);
            ctx.stroke();
            ctx.restore();
        }

        function drawPaddle(pad, color) {
            ctx.save();
            ctx.fillStyle = color;
            ctx.shadowColor = color;
            ctx.shadowBlur = 22;
            roundRect(pad.x, pad.y, paddle.w, paddle.h, 7);
            ctx.fill();
            ctx.restore();
        }

        function drawBall() {
            ctx.save();
            ctx.fillStyle = '#fff';
            ctx.shadowColor = '#00f0ff';
            ctx.shadowBlur = 25;
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }

        function roundRect(x, y, w, h, r) {
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.arcTo(x + w, y, x + w, y + h, r);
            ctx.arcTo(x + w, y + h, x, y + h, r);
            ctx.arcTo(x, y + h, x, y, r);
            ctx.arcTo(x, y, x + w, y, r);
            ctx.closePath();
        }

        function render() {
            ctx.clearRect(0, 0, W, H);
            drawNet();
            drawPaddle(player, '#00f0ff');
            drawPaddle(ai, '#ff2d95');
            drawBall();
        }

        function loop() {
            if (!running || paused) return;
            update();
            render();
            requestAnimationFrame(loop);
        }

        // Input
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowUp') keys.up = true;
            if (e.key === 'ArrowDown') keys.down = true;
            if (e.key === 'p' || e.key === 'P') togglePause();
        });
        document.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowUp') keys.up = false;
            if (e.key === 'ArrowDown') keys.down = false;
        });
        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            mouseY = (e.clientY - rect.top) * (H / rect.height);
        });
        canvas.addEventListener('mouseleave', () => { mouseY = null; });

        startBtn.addEventListener('click', () => {
            if (paused) {
                togglePause();
            } else {
                startGame();
            }
        });

        // Initial render
        render();
    </script>
</body>

</html>
