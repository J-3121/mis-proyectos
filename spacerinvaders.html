<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Invaders - Aprendizaje Paso a Paso</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0d0f18;
            color: #ecf0f1;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        h1 {
            margin-bottom: 10px;
            color: #78c7b7;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.4);
            font-size: 2rem;
        }

        p.subtitle {
            margin-bottom: 20px;
            color: #a0aab0;
            font-size: 0.95rem;
        }

        /* Estilo para nuestro lienzo de juego (Canvas) */
        #gameCanvas {
            background-color: #000000;
            border: 3px solid #00ffcc;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.2);
            border-radius: 4px;
            display: block;
        }

        /* FASE 13: Estilos para la Tabla de Historial de las Últimas 5 Partidas */
        .leaderboard-container {
            margin-top: 25px;
            width: 100%;
            max-width: 600px;
            background: rgba(15, 18, 30, 0.85);
            border: 2px solid #00ffcc;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.15);
            padding: 15px;
        }

        .leaderboard-container h2 {
            color: #00ffcc;
            font-size: 1.1rem;
            margin-bottom: 12px;
            text-shadow: 0 0 8px rgba(0, 255, 204, 0.4);
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        table.leaderboard-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
            color: #ecf0f1;
        }

        table.leaderboard-table th,
        table.leaderboard-table td {
            padding: 8px 10px;
            text-align: center;
            border-bottom: 1px solid rgba(0, 255, 204, 0.15);
        }

        table.leaderboard-table th {
            color: #ffe600;
            border-bottom: 2px solid #00ffcc;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 1px;
        }

        table.leaderboard-table tr:nth-child(even) {
            background-color: rgba(255, 255, 255, 0.03);
        }

        .status-win {
            color: #00ffcc;
            font-weight: bold;
        }

        .status-loss {
            color: #ff0055;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>Space Invaders 🚀</h1>
    <p class="subtitle">Fase 14: Sistema de Oleadas Progresivas y Resistencia Enemiga</p>

    <!-- Elemento HTML Canvas donde se renderizará el juego -->
    <canvas id="gameCanvas" width="600" height="500"></canvas>

    <!-- FASE 13: Contenedor y Tabla HTML para el Historial de las Últimas 5 Partidas -->
    <div class="leaderboard-container">
        <h2>📊 Historial de las Últimas 5 Partidas 🏆</h2>
        <table class="leaderboard-table">
            <thead>
                <tr>
                    <th>#</th>
                    <th>Piloto</th>
                    <th>Puntos</th>
                    <th>K.O. Marcianos</th>
                    <th>Resultado</th>
                    <th>Fecha / Hora</th>
                </tr>
            </thead>
            <tbody id="cuerpoTablaHistorial">
                <!-- Se poblará dinámicamente desde JavaScript usando JSON.parse -->
            </tbody>
        </table>
    </div>

    <script>
        // =========================================================
        // FASE 1: Configuración del Lienzo y Contexto 2D
        // =========================================================

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function dibujarFondo() {
            ctx.fillStyle = '#0b091a'; // Tono espacio muy oscuro
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        // =========================================================
        // FASE 2 & 10: La Nave del Jugador (Propiedades y Vidas)
        // =========================================================

        const jugador = {
            ancho: 40,
            alto: 15,
            x: (canvas.width / 2) - 20,
            y: canvas.height - 15 - 10,
            color: '#ffe600',
            velocidad: 5,
            vidas: 3
        };

        const teclas = {
            Izquierda: false,
            Derecha: false
        };

        let puntaje = 0;
        let enemigosKilled = 0;
        let registroProcesado = false;

        // FASE 14: Sistema de Oleadas Progresivas
        let oleada = 1;

        // =========================================================
        // FASE 12 & 13: Persistencia (localStorage), JSON y Voz
        // =========================================================

        function obtenerMaximoPuntaje() {
            const maximo = localStorage.getItem('space_invaders_max_score');
            return maximo ? parseInt(maximo) : 0;
        }

        function registrarPuntaje(score) {
            const maxActual = obtenerMaximoPuntaje();
            if (score > maxActual) {
                localStorage.setItem('space_invaders_max_score', score);
            }
        }

        function registrarFinDeJuego(gano) {
            if (registroProcesado) return;
            registroProcesado = true;

            const nombreIngresado = prompt('¡Partida finalizada! Ingresa tu nombre de piloto:', 'Comandante') || 'Piloto Anónimo';

            const fechaActual = new Date();
            const fechaFormateada = fechaActual.toLocaleDateString('es-ES') + ' ' + fechaActual.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });

            const nuevaPartida = {
                nombre: nombreIngresado.trim(),
                puntos: puntaje,
                enemigosKilled: enemigosKilled,
                resultado: gano ? 'Victoria' : 'Derrota',
                fecha: fechaFormateada
            };

            const historialPrevio = JSON.parse(localStorage.getItem('space_invaders_historial')) || [];
            historialPrevio.unshift(nuevaPartida);
            const ultimosCinco = historialPrevio.slice(0, 5);

            localStorage.setItem('space_invaders_historial', JSON.stringify(ultimosCinco));
            registrarPuntaje(puntaje);
            actualizarTablaHistorialUI();
        }

        function actualizarTablaHistorialUI() {
            const cuerpoTabla = document.getElementById('cuerpoTablaHistorial');
            if (!cuerpoTabla) return;

            const historial = JSON.parse(localStorage.getItem('space_invaders_historial')) || [];

            if (historial.length === 0) {
                cuerpoTabla.innerHTML = `<tr><td colspan="6" style="color: #a0aab0; font-style: italic;">No hay partidas registradas aún. ¡Juega tu primera partida!</td></tr>`;
                return;
            }

            cuerpoTabla.innerHTML = historial.map((partida, index) => `
                <tr>
                    <td>${index + 1}</td>
                    <td><strong>${partida.nombre}</strong></td>
                    <td style="color: #ffe600;">${partida.puntos}</td>
                    <td>${partida.enemigosKilled}</td>
                    <td class="${partida.resultado === 'Victoria' ? 'status-win' : 'status-loss'}">${partida.resultado}</td>
                    <td style="font-size: 0.75rem; color: #a0aab0;">${partida.fecha}</td>
                </tr>
            `).join('');
        }

        function decirTexto(mensajeTexto) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();

                const locucion = new SpeechSynthesisUtterance(mensajeTexto);
                locucion.lang = 'es-ES';
                locucion.rate = 1.0;
                locucion.pitch = 1.1;

                window.speechSynthesis.speak(locucion);
            }
        }

        // =========================================================
        // FASE 4: Sistema de Disparo del Jugador
        // =========================================================

        const proyectiles = [];

        function disparar() {
            if (juegoTerminado) return;

            proyectiles.push({
                x: jugador.x + (jugador.ancho / 2) - 2,
                y: jugador.y,
                ancho: 4,
                alto: 10,
                velocidad: 10,
                color: '#00ffff'
            });
        }

        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') teclas.Izquierda = true;
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') teclas.Derecha = true;

            if (e.code === 'Space') {
                disparar();
            }
        });

        window.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') teclas.Izquierda = false;
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') teclas.Derecha = false;
        });

        // =========================================================
        // FASE 5 & 14: Generación de Enemigos y Resistencia por Oleada
        // =========================================================

        const enemigos = [];
        const filasEnemigos = 4;
        const columnasEnemigos = 8;
        const enemigoAncho = 30;
        const enemigoAlto = 20;
        const enemigoPadding = 15;
        const enemigoOffsetTop = 45;
        const enemigoOffsetLeft = 70;

        function crearEnemigos() {
            enemigos.length = 0; // Limpiamos el arreglo para la nueva horda

            // FASE 14: En oleadas 3+, las filas superiores tienen 2 de salud (requieren 2 disparos)
            for (let f = 0; f < filasEnemigos; f++) {
                for (let c = 0; c < columnasEnemigos; c++) {
                    const x = enemigoOffsetLeft + c * (enemigoAncho + enemigoPadding);
                    const y = enemigoOffsetTop + f * (enemigoAlto + enemigoPadding);

                    // La fila superior es más resistente a partir de la oleada 3
                    const saludMax = (f === 0 && oleada >= 3) ? 2 : 1;

                    enemigos.push({
                        x: x,
                        y: y,
                        ancho: enemigoAncho,
                        alto: enemigoAlto,
                        colorBase: '#ff00aa',
                        salud: saludMax,
                        saludMax: saludMax,
                        vivo: true
                    });
                }
            }
        }

        crearEnemigos();

        function dibujarEnemigos() {
            enemigos.forEach(e => {
                if (e.vivo) {
                    // FASE 14: Degradación visual según salud restante del enemigo
                    if (e.salud === 2) {
                        ctx.fillStyle = '#a855f7'; // Violeta neón (Enemigo Blindado/Fuerte)
                    } else if (e.salud === 1 && e.saludMax > 1) {
                        ctx.fillStyle = '#ff7700'; // Naranja neón (Enemigo Dañado)
                    } else {
                        ctx.fillStyle = e.colorBase; // Magenta estándar
                    }
                    ctx.fillRect(e.x, e.y, e.ancho, e.alto);
                }
            });
        }

        // =========================================================
        // FASE 11: Torres Defensivas / Escudos Destruibles
        // =========================================================

        const escudos = [];
        const cantidadEscudos = 4;
        const escudoAncho = 60;
        const escudoAlto = 20;

        function crearEscudos() {
            escudos.length = 0;
            const espacioEfectivo = canvas.width / (cantidadEscudos + 1);

            for (let i = 0; i < cantidadEscudos; i++) {
                const x = espacioEfectivo * (i + 1) - (escudoAncho / 2);
                const y = jugador.y - 60;

                escudos.push({
                    x: x,
                    y: y,
                    ancho: escudoAncho,
                    alto: escudoAlto,
                    salud: 5,
                    saludMax: 5
                });
            }
        }

        crearEscudos();

        function dibujarEscudos() {
            escudos.forEach(escudo => {
                if (escudo.salud > 0) {
                    const porcentaje = escudo.salud / escudo.saludMax;
                    if (porcentaje > 0.6) ctx.fillStyle = '#00ff88';
                    else if (porcentaje > 0.3) ctx.fillStyle = '#ffaa00';
                    else ctx.fillStyle = '#ff3333';

                    ctx.fillRect(escudo.x, escudo.y, escudo.ancho, escudo.alto);
                }
            });
        }

        // =========================================================
        // FASE 9 & 14: Sistema de Disparos Enemigos Progresivo
        // =========================================================

        const proyectilesEnemigos = [];

        function dispararEnemigos() {
            const enemigosVivos = enemigos.filter(e => e.vivo);
            if (enemigosVivos.length === 0) return;

            // FASE 14: La probabilidad de disparo incrementa ligeramente con cada oleada (máximo 3.5%)
            const probabilidadDisparo = Math.min(0.035, 0.015 + (oleada - 1) * 0.00335);

            if (Math.random() < probabilidadDisparo) {
                const indiceAleatorio = Math.floor(Math.random() * enemigosVivos.length);
                const tirador = enemigosVivos[indiceAleatorio];

                // FASE 14: Velocidad del proyectil enemigo se incrementa ligeramente por oleada
                const velocidadProyectilEnemigo = Math.min(6, 4 + (oleada - 1) * 0.3);

                proyectilesEnemigos.push({
                    x: tirador.x + (tirador.ancho / 2) - 2,
                    y: tirador.y + tirador.alto,
                    ancho: 4,
                    alto: 10,
                    velocidad: velocidadProyectilEnemigo,
                    color: '#ff3300'
                });
            }
        }

        // =========================================================
        // FASE 6 & 14: Colisiones AABB y Daño a Enemigos
        // =========================================================

        function detectarColisiones() {
            for (let i = proyectiles.length - 1; i >= 0; i--) {
                const p = proyectiles[i];

                for (let j = 0; j < enemigos.length; j++) {
                    const e = enemigos[j];

                    if (e.vivo) {
                        if (
                            p.x < e.x + e.ancho &&
                            p.x + p.ancho > e.x &&
                            p.y < e.y + e.alto &&
                            p.y + p.alto > e.y
                        ) {
                            proyectiles.splice(i, 1); // El proyectil se consume al impactar
                            e.salud--; // FASE 14: Restamos resistencia al enemigo

                            if (e.salud <= 0) {
                                e.vivo = false;
                                velocidadEnemigos += 0.05;
                                puntaje += 10 * oleada; // FASE 14: Más puntos en oleadas superiores
                                enemigosKilled++;
                                console.log("Puntaje:", puntaje, "K.O.:", enemigosKilled);
                            }
                            break;
                        }
                    }
                }
            }
        }

        // =========================================================
        // FASE 7 & 14: Movimiento de la Horda (Zigzag con Velocidad Base por Oleada)
        // =========================================================

        let direccionEnemigos = 1;
        let velocidadEnemigos = 1;
        const descensoEnemigos = 15;

        function actualizarEnemigos() {
            let tocoPared = false;

            enemigos.forEach(e => {
                if (e.vivo) {
                    if (
                        (direccionEnemigos === 1 && e.x + e.ancho >= canvas.width) ||
                        (direccionEnemigos === -1 && e.x <= 0)
                    ) {
                        tocoPared = true;
                    }
                }
            });

            if (tocoPared) {
                direccionEnemigos *= -1;
                enemigos.forEach(e => {
                    if (e.vivo) {
                        e.y += descensoEnemigos;
                    }
                });
            } else {
                enemigos.forEach(e => {
                    if (e.vivo) {
                        e.x += velocidadEnemigos * direccionEnemigos;
                    }
                });
            }
        }

        // =========================================================
        // FASE 8, 14: Estado del Juego y Progresión de Oleadas
        // =========================================================

        let juegoTerminado = false;
        let victoria = false;

        function pasarASiguienteOleada() {
            oleada++;
            proyectiles.length = 0;
            proyectilesEnemigos.length = 0;

            // Incrementamos la velocidad base de la nueva horda gradualmente
            velocidadEnemigos = 1 + (oleada - 1) * 0.25;
            direccionEnemigos = 1;

            crearEnemigos();
            decirTexto(`Oleada ${oleada}`);
        }

        function recibirDanioJugador() {
            jugador.vidas--;
            jugador.x = (canvas.width / 2) - (jugador.ancho / 2);

            if (jugador.vidas <= 0) {
                juegoTerminado = true;
                victoria = false;
                registrarFinDeJuego(false);
                decirTexto('Game Over. Tu nave ha sido destruida.');
            }
        }

        function comprobarEstadoJuego() {
            // FASE 14: Al destruir todos los enemigos de la oleada actual, pasamos a la siguiente oleada
            const todosDestruidos = enemigos.every(e => !e.vivo);
            if (todosDestruidos && !juegoTerminado) {
                pasarASiguienteOleada();
                return;
            }

            enemigos.forEach(e => {
                if (e.vivo && e.y + e.alto >= jugador.y) {
                    jugador.vidas = 0;
                    juegoTerminado = true;
                    victoria = false;
                    registrarFinDeJuego(false);
                    decirTexto('Game Over. Los invasores han invadido la base.');
                }
            });
        }

        function dibujarUI() {
            const maxPuntaje = obtenerMaximoPuntaje();

            // Puntaje Actual
            ctx.fillStyle = '#ffffff';
            ctx.font = '15px monospace';
            ctx.fillText(`PUNTOS: ${puntaje}`, 15, 28);

            // FASE 14: Indicador de Oleada Actual
            ctx.fillStyle = '#00ffcc';
            ctx.fillText(`OLEADA: ${oleada}`, 145, 28);

            // Máximo Puntaje Persistente (localStorage)
            ctx.fillStyle = '#a0aab0';
            ctx.fillText(`MÁXIMO: ${maxPuntaje}`, 250, 28);

            // Vidas del Jugador
            ctx.fillStyle = '#ffe600';
            ctx.fillText(`VIDAS: ${'❤️ '.repeat(Math.max(0, jugador.vidas))}`, canvas.width - 150, 28);

            // Pantalla Final (Si pierde el jugador)
            if (juegoTerminado) {
                ctx.fillStyle = victoria ? '#00ffcc' : '#ff0055';
                ctx.font = 'bold 36px monospace';
                ctx.textAlign = 'center';

                const mensaje = victoria ? '¡VICTORIA TOTAL! 🎉' : '¡GAME OVER! 💀';
                ctx.fillText(mensaje, canvas.width / 2, canvas.height / 2 - 10);

                ctx.font = '16px monospace';
                ctx.fillStyle = '#a0aab0';
                ctx.fillText('Recarga la página (F5) para volver a jugar', canvas.width / 2, (canvas.height / 2) + 35);

                ctx.textAlign = 'start';
            }
        }

        // =========================================================
        // MOTOR DEL JUEGO: Actualizar, Renderizar y Game Loop
        // =========================================================

        function actualizar() {
            if (juegoTerminado) return;

            // 1. Movimiento del jugador
            if (teclas.Izquierda && jugador.x > 0) {
                jugador.x -= jugador.velocidad;
            }
            if (teclas.Derecha && jugador.x < canvas.width - jugador.ancho) {
                jugador.x += jugador.velocidad;
            }

            // 2. Movimiento y Limpieza de Proyectiles del Jugador
            for (let i = proyectiles.length - 1; i >= 0; i--) {
                const p = proyectiles[i];
                p.y -= p.velocidad;

                if (p.y + p.alto < 0) {
                    proyectiles.splice(i, 1);
                }
            }

            // 3. Disparos Enemigos y Colisiones
            dispararEnemigos();

            for (let i = proyectilesEnemigos.length - 1; i >= 0; i--) {
                const pe = proyectilesEnemigos[i];
                pe.y += pe.velocidad;

                if (pe.y > canvas.height) {
                    proyectilesEnemigos.splice(i, 1);
                    continue;
                }

                // Colisión Proyectil Enemigo vs Escudos
                let impactoEscudo = false;
                for (let k = 0; k < escudos.length; k++) {
                    const esc = escudos[k];
                    if (esc.salud > 0) {
                        if (
                            pe.x < esc.x + esc.ancho &&
                            pe.x + pe.ancho > esc.x &&
                            pe.y < esc.y + esc.alto &&
                            pe.y + pe.alto > esc.y
                        ) {
                            esc.salud--;
                            proyectilesEnemigos.splice(i, 1);
                            impactoEscudo = true;
                            break;
                        }
                    }
                }

                if (impactoEscudo) continue;

                // Colisión Proyectil Enemigo vs Jugador
                if (
                    pe.x < jugador.x + jugador.ancho &&
                    pe.x + pe.ancho > jugador.x &&
                    pe.y < jugador.y + jugador.alto &&
                    pe.y + pe.alto > jugador.y
                ) {
                    proyectilesEnemigos.splice(i, 1);
                    recibirDanioJugador();
                }
            }

            // 4. Movimiento de enemigos
            actualizarEnemigos();

            // 5. Colisiones disparos jugador vs enemigos
            detectarColisiones();

            // 6. Estado del juego
            comprobarEstadoJuego();
        }

        function dibujarJugador() {
            ctx.fillStyle = jugador.color;
            ctx.fillRect(jugador.x, jugador.y, jugador.ancho, jugador.alto);
        }

        function dibujarProyectiles() {
            proyectiles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x, p.y, p.ancho, p.alto);
            });
        }

        function dibujarProyectilesEnemigos() {
            proyectilesEnemigos.forEach(pe => {
                ctx.fillStyle = pe.color;
                ctx.fillRect(pe.x, pe.y, pe.ancho, pe.alto);
            });
        }

        function bucleJuego() {
            actualizar();
            renderizar();
            requestAnimationFrame(bucleJuego);
        }

        function renderizar() {
            dibujarFondo();
            dibujarEscudos();
            dibujarJugador();
            dibujarProyectiles();
            dibujarProyectilesEnemigos();
            dibujarEnemigos();
            dibujarUI();
        }

        // Carga Inicial: Renderizamos la Tabla HTML desde localStorage
        actualizarTablaHistorialUI();

        // Arrancamos el motor del juego
        bucleJuego();
    </script>
</body>

</html>
